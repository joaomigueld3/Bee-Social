name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Vulnerabilidades de dependências
        run: npm audit --audit-level=high
      - name: Provas das specs (onp-spec verify)
        run: |
          for dir in .spec/features/*/; do
            npm run spec -- verify "$(basename "$dir")"
          done
      - name: Auditoria de specs (onp-spec)
        run: npm run spec:audit
